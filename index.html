<title>Непал для своих</title>
<meta name="description" content="Непал для своих — 11 дней: тибетский квартал Катманду, Патан, озеро Фева и четырёхдневный трек Гхорепани — Пунхилл — Гандрук.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style id="css">
  :root {
    --paper: #F5F1E9;
    --paper-2: #EAE4D6;
    --ink: #23372F;
    --ink-2: #1A2A24;
    --muted: #6B7269;
    --line: #D8D6C9;
    --terra: #BC5533;
    --cream: #E7D9BA;
    --gold: #C09A4E;
    --serif: "Prata", Georgia, "Times New Roman", serif;
    --sans: "Golos Text", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  figure { margin: 0; }
  html { scroll-behavior: smooth; scroll-padding-top: 20px; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { font-family: var(--serif); font-weight: 400; line-height: 1.2; }
  h2 { font-size: clamp(25px, 4.2vw, 56px); letter-spacing: -.02em; overflow-wrap: break-word; }
  p + p { margin-top: 14px; }

  .wrap { width: min(1200px, calc(100% - 80px)); margin: 0 auto; }

  .eyebrow {
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .22em;
    line-height: 1.5;
  }
  .muted { color: var(--muted); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    min-height: 54px;
    padding: 14px 24px;
    background: var(--terra);
    color: #FFF;
    border: 1px solid var(--terra);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: background .2s ease, transform .2s ease;
  }
  .btn:hover { background: #A4462A; transform: translateY(-2px); }
  .btn.light { background: var(--cream); color: var(--ink); border-color: var(--cream); }
  .btn.light:hover { background: #DCCBA4; }

  /* ---------- шапка ---------- */

  .nav {
    position: sticky;
    top: 0;
    z-index: 20;
    height: 88px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 48px;
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .brand-mark {
    width: 34px; height: 34px;
    border: 1px solid var(--ink);
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 19px;
  }
  .brand-text { font-size: 13px; font-weight: 600; letter-spacing: .08em; }
  .brand-sub { display: block; font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
  .navlinks { display: flex; gap: 30px; align-items: center; }
  .navlinks a { text-decoration: none; font-size: 12.5px; color: inherit; }
  .navlinks a:hover { color: var(--terra); }
  .nav-cta { border-bottom: 1px solid var(--ink); padding-bottom: 2px; }

  /* ---------- герой ---------- */

  .hero {
    position: relative;
    min-height: 620px;
    height: 100svh;
    max-height: 760px;
    display: flex;
    color: #FFF;
    overflow: hidden;
    background: #46564F;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background-size: cover;
    background-position: 50% 24%;
  }
  .hero::after {
    content: "";
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(14,28,24,.88), rgba(16,32,27,.45) 52%, rgba(16,32,27,.08) 88%),
      linear-gradient(0deg, rgba(16,32,27,.55), transparent 48%);
  }
  .hero-inner {
    position: relative;
    min-width: 0;
    z-index: 2;
    width: min(1200px, calc(100% - 80px));
    margin: 0 auto;
    padding: 60px 0 34px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .hero .eyebrow { color: var(--cream); }
  .hero h1 {
    font-size: clamp(30px, 5.4vw, 74px);
    letter-spacing: -.025em;
    max-width: 15ch;
    overflow-wrap: break-word;
    margin: 24px 0 18px;
  }
  .hero h1 em { font-style: normal; color: var(--cream); }
  .hero .lead { max-width: 46ch; font-size: 17px; line-height: 1.7; color: #F2EFE7; white-space: pre-line; }
  .hero-actions { display: flex; align-items: center; gap: 26px; margin-top: 30px; flex-wrap: wrap; }
  .hero-actions .btn { min-height: 68px; padding: 18px 34px; font-size: 17px; font-weight: 500; gap: 30px; }
  .hero-when {
    font-family: var(--serif);
    font-size: clamp(24px, 3.4vw, 42px);
    line-height: 1.15;
    letter-spacing: -.01em;
    color: var(--cream);
    margin-top: 26px;
  }
  .hero-link { font-size: 13px; text-decoration: none; color: #FFF; border-bottom: 1px solid rgba(255,255,255,.45); padding-bottom: 5px; }
  .hero-foot {
    margin-top: auto;
    padding-top: 28px;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 20px;
    font-size: 11.5px;
    letter-spacing: .04em;
    color: #E6E3D9;
  }
  .hero-foot .place { max-width: 24ch; text-align: right; }

  /* ---------- факты ---------- */

  .facts {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 30px 0;
    border-bottom: 1px solid var(--line);
  }
  .fact { padding: 0 28px; border-right: 1px solid var(--line); }
  .fact:first-child { padding-left: 0; }
  .fact:last-child { border-right: 0; }
  .fact strong { display: block; font-size: 18px; font-weight: 500; }
  .fact span { font-size: 12.5px; color: var(--muted); }

  /* ---------- вступление ---------- */

  .intro { padding: 90px 0 46px; display: grid; grid-template-columns: .9fr 1.1fr; gap: 90px; }
  .intro h2 { margin-top: 20px; }
  .intro-copy { padding-top: 28px; font-size: 17px; color: var(--muted); }
  .intro-copy .big { font-size: 20px; line-height: 1.62; color: var(--ink); }
  .intro-sign { display: none; }

  /* ---------- три момента ---------- */

  .moments { padding-bottom: 100px; }
  .section-head { margin-bottom: 30px; }
  .section-head h2 { margin-top: 12px; }
  .section-head > p { max-width: 70ch; font-size: 15.5px; color: var(--muted); margin-top: 2px; }
  .moment-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  .moment figure { position: relative; height: 360px; overflow: hidden; background: #BDC3B4; }
  .moment .shot { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform .7s ease; }
  .moment:hover .shot { transform: scale(1.04); }
  .moment .index { display: none; }
  .moment h3 { font-size: 24px; margin: 22px 0 10px; }
  .moment p { font-size: 14px; color: var(--muted); }
  .moment .caption { font-size: 10.5px; margin-top: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }

  /* ---------- маршрут ---------- */

  .route { background: var(--ink); color: var(--paper); padding: 62px 0; }
  .route .wrap { display: grid; grid-template-columns: 1fr 2fr; gap: 60px; align-items: center; }
  .route h2 { font-size: 34px; margin-top: 12px; }
  .route .eyebrow { color: var(--cream); }
  .route-track { display: grid; grid-template-columns: 1.3fr 1fr 1.1fr; gap: 20px; }
  .route-stop { border-top: 1px solid #8FA096; padding-top: 18px; position: relative; }
  .route-stop::before {
    content: ""; position: absolute; left: 0; top: -4px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--cream);
  }
  .route-stop b { display: block; font-size: 17px; font-weight: 500; }
  .route-stop span { font-size: 12px; color: #C2CCC3; }
  .route-stop small { display: block; font-size: 10.5px; color: var(--cream); margin-top: 9px; letter-spacing: .06em; }

  /* ---------- программа ---------- */

  .program { padding: 80px 0; }
  .program-title p { max-width: 52ch; font-size: 14px; color: var(--muted); margin-top: 14px; }
  .days-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 50px; }
  .days-nav a {
    text-decoration: none; color: inherit;
    min-width: 70px; height: 42px; padding: 0 12px;
    display: grid; place-items: center;
    border: 1px solid var(--line);
    font-size: 12px;
  }
  .days-nav a:hover { background: var(--ink); color: #FFF; border-color: var(--ink); }

  .day {
    display: grid;
    grid-template-columns: .95fr 1.05fr;
    gap: 64px;
    padding: 52px 0;
    border-top: 1px solid var(--line);
    scroll-margin-top: 100px;
  }
  .day-visual { position: relative; min-height: 360px; overflow: hidden; background: #B8BFB0; }
  .day-visual .shot { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .day-visual figcaption {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 46px 20px 16px;
    background: linear-gradient(transparent, rgba(16,39,32,.72));
    color: #FFF;
    font-size: 11.5px;
    z-index: 2;
  }
  .day:nth-of-type(even) .day-visual { order: 2; }
  .day-heading { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 14px; }
  .day-no { font-size: 12px; font-weight: 600; color: var(--terra); }
  .day-place { font-size: 10.5px; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); }
  .day h3 { font-size: 30px; margin-bottom: 18px; }
  .day p { font-size: 14.5px; color: var(--muted); }
  .legend {
    font-family: var(--serif);
    font-style: italic;
    font-size: 14.5px;
    line-height: 1.66;
    color: #5E6A5C;
    border-left: 2px solid var(--gold);
    padding-left: 16px;
    margin-bottom: 18px;
  }
  .day-meta { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }

  /* ---------- баннер с горами ---------- */

  .mountain {
    position: relative;
    min-height: 480px;
    display: flex;
    align-items: center;
    text-align: center;
    color: #FFF;
    overflow: hidden;
    background: #58665E;
  }
  .mountain .shot { position: absolute; inset: 0; background-size: cover; background-position: center 40%; }
  .mountain::after { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(17,41,29,.34), rgba(17,41,29,.6)); }
  .mountain .wrap { position: relative; z-index: 2; }
  .mountain h2 { max-width: 22ch; margin: 18px auto; }
  .mountain p { max-width: 52ch; margin: 0 auto; font-size: 15px; color: #F1EFE6; }
  .mountain .eyebrow { color: var(--cream); }

  /* ---------- как живём ---------- */

  .comfort { padding: 100px 0; }
  .comfort-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 38px; margin-top: 42px; }
  .comfort-item { border-top: 1px solid var(--line); padding-top: 22px; }
  .comfort-item .n { color: var(--terra); font-size: 12px; letter-spacing: .1em; }
  .comfort-item h3 { font-size: 23px; margin: 13px 0; }
  .comfort-item p { font-size: 14px; color: var(--muted); }

  /* ---------- даты ---------- */

  .booking { background: var(--paper-2); padding: 90px 0; }
  .booking .wrap { display: grid; grid-template-columns: 1fr 1.05fr; gap: 72px; }
  .booking h2 { margin: 18px 0 22px; }
  .booking-lead { max-width: 42ch; font-size: 15px; color: var(--muted); }
  .price-note { border-top: 1px solid #C8C6B7; padding-top: 20px; margin-top: 28px; max-width: 44ch; font-size: 13.5px; }
  .date-card {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border: 1px solid #C9C9BC;
    padding: 22px 24px;
    margin-bottom: 12px;
  }
  .date-card .date-large { display: block; font-size: 21px; font-weight: 500; }
  .date-card .date-small { font-size: 12px; color: var(--muted); }
  .date-card .tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; color: var(--terra); white-space: nowrap; }

  /* ---------- стоимость ---------- */

  .price { background: var(--ink); color: var(--paper); padding: 96px 0; }
  .price .eyebrow { color: var(--cream); }
  .price h2 { margin: 12px 0 40px; color: var(--paper); }
  .price-top { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; margin-bottom: 52px; }
  .price-sum {
    font-family: var(--serif);
    font-size: clamp(40px, 5.6vw, 72px);
    line-height: 1.05;
    letter-spacing: -.02em;
    color: var(--cream);
  }
  .price-sub { font-size: 15px; color: #C2CCC3; margin-top: 12px; }
  .price-when {
    font-family: var(--serif);
    font-size: 23px;
    color: var(--paper);
    margin-top: 18px;
  }
  .price-extra { border-top: 1px solid #8FA096; padding-top: 18px; margin-top: 24px; font-size: 15px; color: #D9E0D8; }
  .price-extra b { color: var(--paper); font-weight: 600; }
  .price-book { font-size: 16px; color: #D9E0D8; }
  .price-book b { color: var(--cream); font-weight: 600; }
  .price-book p + p { margin-top: 12px; }
  .incl { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
  .incl h3 {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--cream);
    margin-bottom: 16px;
  }
  .incl ul { list-style: none; }
  .incl li { position: relative; padding-left: 20px; font-size: 15.5px; color: #D9E0D8; padding-bottom: 10px; }
  .incl li::before { content: ""; position: absolute; left: 0; top: 11px; width: 8px; height: 1px; background: var(--cream); }
  .incl .out li { color: #BCC7BD; }
  .price-deal {
    margin-top: 48px;
    padding-top: 28px;
    border-top: 1px solid #8FA096;
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 40px;
    align-items: center;
  }
  .price-deal p { font-size: 16px; color: #D9E0D8; max-width: 52ch; }
  .price-deal .btn { justify-self: start; }

  /* ---------- полоска с ценой на телефоне ---------- */

  .paybar { display: none; }

  @media (max-width: 760px) {
    .paybar {
      display: flex;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--ink);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -8px 24px rgba(20,35,30,.22);
      transform: translateY(110%);
      transition: transform .25s ease;
    }
    .paybar.show { transform: translateY(0); }
    .paybar .sum { font-family: var(--serif); font-size: 20px; color: var(--cream); line-height: 1.1; }
    .paybar .sum span { display: block; font-family: var(--sans); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: #A9B5AB; margin-top: 2px; }
    .paybar .btn { min-height: 46px; padding: 12px 18px; font-size: 14px; gap: 12px; }
    body { padding-bottom: 76px; }
  }

  /* ---------- вопросы ---------- */

  .faq { padding: 96px 0; display: grid; grid-template-columns: .8fr 1.2fr; gap: 80px; }
  .faq h2 { margin-top: 16px; font-size: clamp(25px, 3.4vw, 44px); }
  .faq details { border-bottom: 1px solid var(--line); }
  .faq details:first-of-type { border-top: 1px solid var(--line); }
  .faq summary {
    list-style: none;
    padding: 20px 30px 20px 0;
    font-size: 15px;
    cursor: pointer;
    position: relative;
  }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; position: absolute; right: 4px; top: 14px; font-size: 22px; }
  .faq details[open] summary::after { content: "\2212"; }
  .faq details p { font-size: 14px; color: var(--muted); padding: 0 24px 22px 0; }

  /* ---------- финал ---------- */

  .closing { padding: 0 0 96px; text-align: center; }
  .closing .symbol { font-size: 32px; color: var(--terra); }
  .closing h2 { max-width: 24ch; margin: 16px auto 24px; }
  .closing p { font-size: 14px; color: var(--muted); margin-bottom: 24px; }

  .footer { background: var(--ink); color: #DCDBC9; padding: 32px 0; }
  .footer-top { display: flex; justify-content: space-between; align-items: center; gap: 20px; font-size: 11.5px; }
  .footer-top .up { text-decoration: none; color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }

  @media (max-width: 1050px) {
    .wrap, .hero-inner { width: calc(100% - 56px); }
    .nav { padding: 0 28px; }
    .intro { gap: 48px; }
    .day { gap: 34px; }
    .booking .wrap, .faq { gap: 44px; }
    .route .wrap { gap: 34px; }
  }

  @media (max-width: 760px) {
    html, body { overflow-x: hidden; }
    .hero { display: block; }
    .wrap, .hero-inner { width: calc(100% - 36px); max-width: calc(100% - 36px); min-width: 0; }
    .hero-inner { display: flex; flex-direction: column; align-items: flex-start; }
    h1, h2, h3 { overflow-wrap: break-word; }
    .hero h1 { font-size: 31px; line-height: 1.15; max-width: 100%; margin: 16px 0 14px; }
    .hero .lead { font-size: 14.5px; line-height: 1.6; max-width: 100%; }
    .hero-actions { gap: 14px; margin-top: 22px; }
    .hero-actions .btn { min-height: 56px; padding: 14px 20px; font-size: 15px; gap: 16px; width: 100%; }
    .hero-link { font-size: 13px; }
    .hero-when { font-size: 25px; margin-top: 18px; }
    .hero-foot { font-size: 10.5px; padding-top: 18px; }
    .facts { grid-template-columns: 1fr; }
    .fact { padding: 0; border-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
    .fact:last-child { border-bottom: 0; padding-bottom: 0; }
    .intro-copy .big { font-size: 17px; }
    .day .legend { font-size: 14px; }
    .faq summary { font-size: 14.5px; padding-right: 26px; }
    .author p { font-size: 15.5px; }
    .hero { height: auto; min-height: 0; max-height: none; }
    .hero-inner { padding: 40px 0 26px; min-height: 620px; }
    .hero-foot { flex-direction: column; align-items: flex-start; }
    .hero-foot .place { text-align: left; }
    .intro { grid-template-columns: 1fr; gap: 22px; padding: 64px 0; }
    .intro-copy { padding-top: 0; }
    .section-head { display: block; }
    .section-head > p { margin-top: 18px; }
    .moment-grid { grid-template-columns: 1fr; gap: 28px; }
    .moment figure { height: 320px; }
    .route .wrap { grid-template-columns: 1fr; }
    .route-track { grid-template-columns: 1fr; gap: 16px; }
    .program { padding: 62px 0; }
    .day { grid-template-columns: 1fr; padding: 34px 0; gap: 22px; }
    .day-visual { min-height: 290px; order: 0 !important; }
    .day h3 { font-size: 23px; }
    .mountain { min-height: 400px; }
    .comfort { padding: 64px 0; }
    .comfort-grid { grid-template-columns: 1fr; gap: 26px; }
    .faq { padding: 60px 0; grid-template-columns: 1fr; gap: 26px; }
  }

  /* ---------- кто ведёт ---------- */

  .author { padding: 90px 0; border-top: 1px solid var(--line); }
  .author h2 { margin-top: 12px; margin-bottom: 44px; }
  .author-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; }
  .author-grid.solo { grid-template-columns: 1fr; }
  .author-grid.solo .person { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 46px; align-items: start; }
  .author-grid.solo .person .photo-slot { grid-row: span 6; max-width: none; }
  .author-grid.solo .person h3 { margin-top: 0; }
  .person .photo-slot {
    aspect-ratio: 4 / 5;
    max-width: 360px;
    background-color: var(--paper-2);

<script id="data" type="application/json">{"title": "Непал для своих", "brand": "НЕПАЛ", "brandSub": "трек к Пунхиллу и жизнь в долине", "nav": ["Впечатления", "Программа", "Как идём", "Даты ↗"], "heroEyebrow": "", "heroTitle1": "Непал", "heroTitle2": "для своих", "heroLead": "Затеряемся в переулках старого города,\nвстретим рассвет в Гималаях, и,\nвозможно, узнаем себя чуть лучше.", "heroBtn": "Написать", "heroLink": "Что нас ждёт ↓", "heroWhen": "14 – 24 ноября 2026", "heroDates": "14 – 24 ноября", "heroPlace": "", "facts": [["11 дней / 10 ночей", "город и горы"], ["Трек Пунхилл", "четыре дня по тропе"], ["3 210 м", "высшая точка маршрута"], ["Максимум 6 человек", "маленькая группа своих"], ["Два перелёта внутри страны", "включены в стоимость"]], "routeEyebrow": "", "routeTitle": "Маршрут", "route": [["Катманду", "Останавливаемся на Боуде,\nизучаем долину", "ДНИ 1–4"], ["Покхара", "Озеро Фева", "ДЕНЬ 5"], ["Пунхилл", "Трек", "ДНИ 6–9"], ["Снова Покхара", "Озеро и отдых", "ДНИ 9–10"], ["Катманду", "Возвращаемся на Боуду", "ДЕНЬ 11"]], "programEyebrow": "Программа путешествия · 11 дней", "programTitle": "Что делаем?", "programNote": "От первого вечера у Ступы до рассвета у Гималаев: вот что будем делать, видеть и пробовать.", "days": [{"img": "moy-okno-stupa", "alt": "Чай у окна с видом на Ступу", "place": "Прилёт в Катманду · Боуда", "h": "Лампадки у Ступы и ужин на крыше.", "legend": "", "ps": ["Прилетаем, оставляем вещи в отеле и выходим на Боуду – тибетский квартал вокруг огромной белой Ступы, одной из самых больших в мире. В воздухе можжевельник, над головой флаги-лунгта, навстречу бабушки с чётками. Гуляем, созерцаем, прибываем в город.", "Днём полтора часа тибетского массажа – чтобы перелёт остался позади. Вечером присоединяемся к Коре – кругу вокруг Ступы. Кто хочет, зажигает лампадку. Потом забираемся на крышу на ужин и смотрим, как в темноте загорается купол. Наше путешествие началось."], "meta": ""}, {"img": "sluzhba-truby", "alt": "Монахи на утренней службе", "place": "Монастырь Шечен · Пашупатинатх", "h": "Утро в монастыре, библиотека и вечер у реки Багмати.", "legend": "Иногда самое интересное в путешествии – сесть рядом и немного послушать. Сегодня для этого будет целое утро.", "ps": ["Приходим в Шечен рано: сначала один голос, затем низкий гул, барабаны и длинные трубы. После службы попробуем поговорить с монахом о жизни за этими стенами – можно задавать самые обычные человеческие вопросы. Там же заглянем в библиотеку: тибетские тексты, которые собирали и спасали десятилетиями.", "Потом изучаем Боуду поглубже: что означают глаза, зачем вращают барабаны и почему люди снова и снова идут по кругу. После рассказа – чайная и время посмотреть на всё уже чуть внимательнее.", "Вечером едем на Пашупатинатх. Это огромный храмовый комплекс на реке, здесь проходят погребальные обряды. Мы гуляем в стороне от церемоний – каждый выбирает комфортную для себя дистанцию."], "meta": ""}, {"img": "zakat-ktm", "alt": "Закат над Катманду", "place": "Пещеры Асура · Сваямбунатх", "h": "Пещеры Асура и закат над Катманду.", "legend": "", "ps": ["Уезжаем из города в холмы, к пещерам Асура. Идём, дышим, слушаем историю этого места. Если будет возможность, попадаем на пуджу - религиозную церемонию.", "К закату едем на Сваямбунатх – древнейшую Ступу долины Катманду, ей около полутора тысяч лет. Длинная лестница, любопытные обезьяны и весь город внизу в золоте."], "meta": ""}, {"img": "patan-rassvet", "alt": "Патан на рассвете", "place": "Патан · Тамель", "h": "Город мастеров и закупки перед треком.", "legend": "", "ps": ["Королевство Лалитпур, или Патан, – город мастеров и художников. Разглядываем резные окна, львов у входов и дворы, где до сих пор работают с бронзой. Заглянем на площадь Дурбар – это местный Кремль.", "А дальше едем в знаменитый Тамель. Кому нужно снаряжение к треку – пуховка, палки, термобельё, дождевик и другое – закупаемся здесь, обычно это заметно дешевле. А кому снаряжение не нужно, здесь местные бренды, украшения ручной работы, поющие чаши. Плюс кашемир и трикотаж - в Катманду это отдельный вид спорта."], "meta": ""}, {"img": "feva", "alt": "Лодки на озере Фева", "place": "Катманду → Покхара · озеро Фева", "h": "Перелёт к озеру и лодка к островному храму.", "legend": "", "ps": ["Утром короткий перелёт в Покхару – и всё меняется: вместо города вода, горы на горизонте и совсем другой воздух. Идём гулять вдоль набережной, наслаждаемся видами и местной жизнью.", "Днём плывём на лодке по Феве к храму на острове – там тихо и спокойно. Вечером собираем рюкзаки и ложимся пораньше: завтра начинается тропа. Всё лишнее остаётся в отеле – в горы идём налегке."], "meta": ""}, {"img": "trek-lodzha", "alt": "Терраса лоджа с видом на горы", "place": "Заброска · Гхорепани · 2 870 м", "h": "Трек через лес и лучший лодж с видом.", "legend": "ДЕНЬ 1 ТРЕКА", "ps": ["Утром – заброска на джипе к началу тропы. Дальше идём сами: лес, ручьи, деревни, где на верандах сушат кукурузу. Поднимаемся спокойно, 4–5 часов, с остановками на чай, перекусы и созерцание.", "К вечеру приходим в Гхорепани, высокую деревню на гребне, и заселяемся в лучший лодж – тот, где Гималаи видно прямо из окна и с террасы. Чай, ужин, тишина. За окном темнеет, а на горах ещё долго держится последний свет."], "meta": "", "imgs": [["trek-lodzha", "Терраса лоджа с видом на горы"], ["moy-noski", "Утро на террасе лоджа"]], "mobileOne": true, "note": "кайфуем", "notePos": "on-second hide-mobile smile"}, {"img": "punhil-rassvet", "alt": "Рассвет над Гималаями", "place": "Пунхилл 3 210 м · Тадапани", "h": "Рассвет на Пунхилле и спуск в ущелье.", "legend": "ДЕНЬ 2 ТРЕКА", "ps": ["Рассвет встречаем совсем рядом с лоджем. Сначала сереет, потом снег на Дхаулагири и Аннапурне становится розовым, а Мачапучаре – рыбий хвост – выходит из тени последним. Мы просто сидим и смотрим, попивая горячий чаёк. Ради этого утра сюда и идут.", "Спускаемся, завтракаем и уходим дальше по хребту в сторону Тадапани. Тропа идёт через мшистый лес, весь день нам то открываются, то прячутся горы. Ночуем в лодже, где утром из окна видно и ущелье, и снежную гряду."], "meta": ""}, {"img": "moy-most", "alt": "Подвесной мост над ущельем", "place": "Тадапани → Гандрук · 1 940 м", "h": "Утро над ущельем и деревни гурунгов.", "legend": "ДЕНЬ 3 ТРЕКА", "ps": ["Утром никуда не спешим: выходим на террасу с чаем и наслаждаемся видами на ущелье и на горы.", "Потом спуск через лес: становится теплее, появляются террасы, и мы проходим знаменитые гималайские подвесные мосты – с них открывается потрясающий вид на реку и долину.", "Приходим в Гандрук – большую каменную деревню гурунгов. Узкие мощёные улочки, сланцевые крыши и вид на Аннапурну Южную прямо с площади. Здесь лёгкий темп и время просто смотреть."], "meta": "", "note": "а это мы идём в Гандрук", "notePos": "tl"}, {"img": "reka-gory", "alt": "Река в ущелье", "place": "Гандрук → Джину Данда → Покхара", "h": "Горячие источники у реки и возвращение к озеру.", "legend": "ДЕНЬ 4 ТРЕКА", "ps": ["Спускаемся к реке Моди Кхола. У деревни, прямо у воды, устроены горячие источники: они хорошо расслабляют мышцы после четырёх дней тропы.", "Дальше джип и дорога обратно в Покхару. Вечером – ужин у озера и приятные посиделки после трека."], "meta": ""}, {"img": "holmy", "alt": "Холмы над озером", "place": "Покхара · свободный день", "h": "День без плана.", "legend": "", "ps": ["Этот день мы не расписываем заранее. Захочется двигаться – поедем в тибетское поселение: ковры ручной работы, небольшие лавки, чай и момо. Или по окрестностям: водопад, пещера, смотровая над озером. Захочется встретить рассвет ещё раз – поднимемся на Сарангкот.", "Захочется просто лежать – лежим. Кофе у воды, книжка, каяк, массаж, прогулка вдоль набережной. После гор это ощущается особенно хорошо.", "Вечером собираемся на общий ужин: вспоминаем, где побывали, и делимся тем, что у каждого осталось после этих дней."], "meta": ""}, {"img": "boudha-vecher", "alt": "Ступа Боуднатх вечером", "place": "Покхара → Катманду", "h": "Утренний рейс, последние покупки – и по домам.", "legend": "", "ps": ["Утром летим в Катманду. Если хватит времени, можно доехать до Тамеля или докупить всё нужное прямо на Боуде.", "Кто-то едет в аэропорт, кто-то остаётся в Непале подольше. Если захочется продолжить, подскажу, куда двигаться дальше: в Непале очень много мест, которые хочется показать."], "meta": ""}], "mountainEyebrow": "УТРО НА ПУНХИЛЛЕ", "mountainTitle": "Некоторые планы хочется строить вокруг рассвета.", "mountainNote": "Пунхилл – 3 210 метров и одна из самых красивых панорам Непала: восьмитысячники Дхаулагири и Аннапурна, и Мачапучаре, на который до сих пор запрещено подниматься.", "comfortEyebrow": "Как это устроено", "comfortTitle": "Как будем идти?", "comfortNote": "", "comfort": [["01 / ТЕМП", "Есть время выдохнуть", "Чередуем прогулки, поездки и остановки на чай. После перелёта нас ждёт тибетский массаж – чтобы прийти в себя и привыкнуть к новому месту. Насыщенные дни идут вперемешку со спокойными."], ["02 / ГОРЫ", "Идём комфортным темпом", "Четыре дня по 4–5 часов ходьбы, с остановками на чай, обед и созерцание. Максимальная высота – 3 210 м на Пунхилле: на такой высоте горная болезнь практически не встречается. Маршрут выбран несложный – он по силам каждому, кто привык ходить пешком."], ["03 / ПРОЖИВАНИЕ", "Живём на одном месте", "Четыре ночи подряд на Боуде – не нужно собирать чемодан каждое утро. Размещение по двое; для одноместного есть доплата."], ["04 / ДОРОГА", "Комфорт продуман", "В Покхару летим самолётом – это полчаса вместо долгой дороги. По земле передвигаемся на машинах. Тяжёлые рюкзаки нести не придётся: на треке с нами портеры, у каждого участника они берут до 6 кг, на плечах остаётся 3–4 кг."]], "authorEyebrow": "кто ведёт", "authorTitle": "Поедем вместе", "authors": [{"name": "", "slot": "Муштари", "img": "mushtari", "paras": ["Привет!\nМеня зовут Муштари. Мне 37 лет.", "Была в 30+ странах, но именно в Непале со мной происходит что-то особенное. Здесь включается режим ученика а месяц-полтора до поездки гулять по часу в день и подниматься по лестницам, этого достаточно. Тяжёлое нести не придётся – 6 кг из рюкзака берёт портер, он включён в стоимость."], ["А высота хорошо переносится?", "Максимальная точка – Пунхилл, 3 210 м, и проводим мы на ней около часа. Ночуем не выше 2 870 м. На таких высотах горная болезнь встречается редко, а специальная акклиматизация не требуется. Поднимаемся постепенно и пьём много воды."], ["Что если я не хочу в горы?", "Можно остаться в Покхаре на эти четыре дня: озеро, массаж, окрестности, кафе с видом. Присоединишься к группе, когда мы спустимся. Это совершенно нормальный вариант."], ["Как устроены лоджи на треке?", "Это простые горные гостевые дома: комната с двумя кроватями и тёплыми одеялами, общий зал с печкой, где все собираются по вечерам. Душ горячий, иногда за небольшую доплату. Розетки есть, интернет местами. Обстановка простая, но тёплая."], ["Что брать с собой?", "Пришлю подробный список, когда договоримся. Специально закупаться заранее не нужно: всё необходимое – пуховку, палки, термобельё, дождевик – купим в Катманду на четвёртый день, там это заметно дешевле. Из дома важно привезти только удобные разношенные ботинки."], ["Почему ноябрь?", "Ноябрь – самое ясное небо в году: Дхаулагири и Аннапурна открыты почти каждое утро, дождей нет, на тропе сухо. Середина месяца хороша ещё и тем, что осенние праздники уже прошли и страна живёт обычной жизнью. Ночи в горах холодные, около нуля, поэтому понадобится тёплая одежда."], ["Это религиозное путешествие?", "Это знакомство со страной, в которой религия вплетена в повседневную жизнь. Символику объясняем, за ритуалами можно наблюдать. Участвовать, совершать подношения или принимать чьи-то убеждения не требуется."], ["А кремации обязательно смотреть?", "Нет. В Пашупатинатхе можно гулять в стороне от погребальных церемоний. Каждый выбирает комфортную дистанцию."], ["Можно приехать одному или остаться подольше?", "Приехать одному можно: нас максимум шестеро.   const app = document.getElementById('app').textContent;
  const json = JSON.stringify(D).replace(/<\//g, '<\\/');
  return '<!doctype html>\n<html lang="ru">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>' +
    D.title.replace(/[<>&]/g,'') + '</title>\n' +
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
    '<link href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">\n' +
    '<style id="css">' + css + '</style>\n</head>\n<body>\n<div id="root"></div>\n' +
    '<script id="data" type="application/json">' + json + '<\/script>\n' +
    '<script id="app">' + app + '<\/script>\n</body>\n</html>';
}

btnSave.addEventListener('click', async () => {
  if (!api) return;
  btnSave.disabled = true;
  state.textContent = 'сохраняю…';
  try {
    await api.publish(buildDoc());
    dirty = false;
    state.textContent = 'сохранено';
  } catch (err) {
    const code = err && err.code;
    if (code === 'conflict') state.textContent = 'кто-то сохранил раньше, страница обновится';
    else if (code === 'not_writer' || code === 'not_granted') { state.textContent = 'только просмотр'; bar.hidden = true; }
    else state.textContent = 'не сохранилось, попробуй ещё раз';
    btnSave.disabled = false;
  }
});

(async () => {
  try {
    api = await claude.use('artifact');
  } catch (e) { api = null; }
  if (api) { bar.hidden = false; }
})();
</script>
